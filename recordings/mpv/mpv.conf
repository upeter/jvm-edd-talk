# Talk player settings. Loaded only via play.sh (--config-dir), never from ~/.config/mpv.
fullscreen=yes
# Borderless fullscreen on the current Space: no Space-slide animation, Preview can open on top.
native-fs=no
pause=yes
# Freeze on the last frame of every clip; never auto-advance.
keep-open=always
# No on-screen controller (it would show the filename on mouse move); the seek bar still shows.
osc=no
osd-on-seek=bar
cursor-autohide=1000
screenshot-format=png
save-position-on-quit=no
# Seek bar flush with the bottom edge, nearly full width, thin.
osd-bar-align-y=1
osd-bar-w=98
osd-bar-h=2
