# Talk player key bindings. Replaces mpv defaults for these keys only.
SPACE          cycle pause
RIGHT          script-binding talk/speed-up
LEFT           script-binding talk/speed-down
BS             script-binding talk/speed-reset

# Scrub like scrolling a feed: scroll down / swipe right moves forward.
WHEEL_DOWN     seek  1 exact
WHEEL_UP       seek -1 exact
WHEEL_RIGHT    seek  1 exact
WHEEL_LEFT     seek -1 exact

# Next / previous clip, loaded paused at 1x.
# Shift+arrows: free in macOS. PGDWN/PGUP: presenter clicker (Fn+Down/Up on a MacBook).
Shift+RIGHT    script-binding talk/next
Shift+LEFT     script-binding talk/prev
PGDWN          script-binding talk/next
PGUP           script-binding talk/prev

# Frame to Preview for Live Text.
t              script-binding talk/live-text

q              quit
ESC            ignore
